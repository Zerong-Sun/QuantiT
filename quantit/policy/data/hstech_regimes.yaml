themes:
  - platforms
  - hardware
  - semis
  - ev

# Integer scores in [-2, 2] per theme. Overlapping regimes are summed then clipped.
# These are structured policy/geopolitical *regimes*, not news headlines.
regimes:
  - name: covid_shock
    start: 2020-01-01
    end: 2020-03-31
    scores:
      platforms: -1
      hardware: -1
      semis: -1
      ev: -1
    notes: "Global risk-off. Not a China-specific internet crackdown."

  - name: recovery_and_nev_support
    start: 2020-04-01
    end: 2021-06-30
    scores:
      platforms: 1
      hardware: 1
      semis: 0
      ev: 1
    notes: "Liquidity recovery; NEV industrial policy still supportive; platforms not yet in the 2021 clampdown."

  - name: internet_crackdown
    start: 2021-07-01
    end: 2022-11-30
