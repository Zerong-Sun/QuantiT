[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantit"
version = "0.1.0"
description = "A research-oriented quantitative trading platform for US equities and HK long-horizon strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuantiT" }]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "plotly>=5.18",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "httpx>=0.27",
    "fastapi>=0.110",
]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "torch>=2.0",
    "stable-baselines3>=2.2",
    "gymnasium>=0.29",
]
paper = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "akshare>=1.14",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "akshare>=1.14",
]
viz = [
    "matplotlib>=3.8",
]

[project.scripts]
quantit = "quantit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantit*"]

[tool.setuptools.package-data]
"quantit.policy.data" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
