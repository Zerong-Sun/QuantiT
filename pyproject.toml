[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantit"
version = "0.1.0"
description = "A research-oriented US equity quantitative trading platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuantiT" }]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "torch>=2.0",
    "stable-baselines3>=2.2",
    "gymnasium>=0.29",
    "streamlit>=1.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]

[project.scripts]
quantit = "quantit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
